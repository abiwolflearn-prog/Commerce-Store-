name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t commerce-store .

      - name: Test Docker container
        run: |
          docker run -d --name commerce-store -p 3000:80 commerce-store
          sleep 5
          curl http://localhost:3000